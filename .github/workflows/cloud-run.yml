name: Deploy Cloud Run

# Push lên main -> Cloud Build chạy cloudbuild.yaml (build image, deploy service event-mng-api).
# Đăng nhập GCP bằng Workload Identity Federation: GitHub cấp OIDC token cho job, GCP đổi thành quyền
# của service account event-mng-deployer. Không có key nào lưu trên GitHub; provider chỉ nhận token
# của repo này trên nhánh main (tạo bằng ./deploy/gcp.sh github <PROJECT_ID>, xem deploy/README.md bước 9).
# Chạy lại không cần commit: Actions > Deploy Cloud Run > Run workflow (nhánh main).

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Không deploy chồng nhau: lần sau đợi lần trước xong.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: event-mng-510915
  WORKLOAD_IDENTITY_PROVIDER: projects/431351932095/locations/global/workloadIdentityPools/github/providers/be-event-mng-v3
  DEPLOYER_SA: event-mng-deployer@event-mng-510915.iam.gserviceaccount.com
  SERVICE_URL: https://event-mng-api-431351932095.asia-southeast1.run.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # Giống ./deploy/gcp.sh deploy. Log chi tiết: link "Logs are available at" bên dưới (Cloud Build > History).
      - name: Build + deploy (cloudbuild.yaml)
        run: |
          gcloud builds submit . --project "$PROJECT_ID" --config cloudbuild.yaml \
            --service-account "projects/$PROJECT_ID/serviceAccounts/$DEPLOYER_SA"

      - name: Gọi thử /api/v1/ping
        run: curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "$SERVICE_URL/api/v1/ping"
